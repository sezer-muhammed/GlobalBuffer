[build-system]
requires = ["setuptools>=68", "wheel", "Cython>=3.0", "numpy>=1.23,<2.5"]
build-backend = "setuptools.build_meta"

[project]
name = "global_buffer"
dynamic = ["version"]
description = "Cross-platform cross-process shared-memory ring buffer: zero-copy numpy arrays, Pydantic/protobuf messages, and CPU-efficient callbacks."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{ name = "Izzet Sezer" }]
keywords = ["shared-memory", "ipc", "ring-buffer", "numpy", "pydantic", "protobuf", "zero-copy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: System :: Hardware",
  "Topic :: System :: Networking",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.23,<2.5", "msgspec>=0.18", "pydantic>=2", "protobuf>=4.21"]

[project.urls]
Homepage = "https://github.com/sezer-muhammed/GlobalBuffer"
Repository = "https://github.com/sezer-muhammed/GlobalBuffer"
Documentation = "https://github.com/sezer-muhammed/GlobalBuffer/tree/main/docs"
Changelog = "https://github.com/sezer-muhammed/GlobalBuffer/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/sezer-muhammed/GlobalBuffer/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "Cython>=3.0"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["global_buffer"]

[tool.setuptools.dynamic]
version = { attr = "global_buffer._version.__version__" }

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_i686 *_i686 pp*"
test-requires = ["pytest", "numpy", "msgspec", "pydantic", "protobuf"]
test-command = 'pytest {project}/tests -m "not crossproc_slow"'
archs = ["auto64"]

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
# aarch64 tests run under QEMU emulation which is far too slow for the
# cross-process timing tests (subprocess startup > 10 s).  Build the
# wheels for arm64 hardware but skip testing under emulation.
test-skip = "*-manylinux_aarch64 *-musllinux_aarch64"

[tool.pytest.ini_options]
markers = ["crossproc_slow: long cross-process stress tests"]
