name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build + runtime deps
        run: python -m pip install -U pip setuptools wheel Cython numpy msgspec pydantic pytest
      - name: Build extension
        run: python setup.py build_ext --inplace
      - name: Run tests
        run: python -m pytest tests -v -m "not crossproc_slow"
        env:
          PYTHONPATH: src
